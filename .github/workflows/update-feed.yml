name: Aggiorna feed sismico Etna

on:
  schedule:
    # Ogni 15 minuti. Su GitHub Actions gli orari cron possono avere qualche
    # minuto di ritardo nei momenti di alto carico globale: normale, non è un bug.
    - cron: "*/15 * * * *"
  workflow_dispatch: {}  # permette anche l'avvio manuale dalla tab Actions

permissions:
  contents: write

jobs:
  update-feed:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests

      - name: Aggiorna data/feed.json
        run: python3 scripts/fetch_terremoti.py

      # Fix 2026-08: stesso problema di collisione descritto in
      # update-comunicati.yml (entrambi scrivono su feed.json) — stesso fix.
      - name: Commit e push (con retry anti-collisione)
        run: |
          git config user.name "etna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git commit -m "Aggiorna feed sismico [automatico]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push riuscito al tentativo $i."
              exit 0
            fi
            echo "Push rifiutato (probabile collisione con un altro workflow), tentativo $i/5: pull --rebase e riprovo tra qualche secondo..."
            sleep $((RANDOM % 10 + 3))
            git pull --rebase origin main
          done
          echo "Push fallito dopo 5 tentativi." >&2
          exit 1
