name: Aggiorna bollettino settimanale INGV (gas + dati scientifici)

on:
  schedule:
    # Il bollettino esce circa una volta a settimana (di solito
    # martedì): un controllo ogni 3 ore è più che sufficiente, non ha
    # senso interrogare INGV più spesso per una risorsa che cambia così
    # di rado (vedi PROGETTO_NOTE.md §16 per il confronto con gli altri
    # job, più frequenti perché seguono dati quasi in tempo reale).
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-bollettino:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests pdfplumber

      - name: Aggiorna data/bollettino.json
        id: fetch
        run: python3 scripts/fetch_bollettino.py
        continue-on-error: true

      # Stesso motivo di update-hotspot.yml/update-aviation.yml.
      - name: Commit e push (con retry anti-collisione)
        if: always()
        run: |
          git config user.name "etna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/bollettino.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git commit -m "Aggiorna bollettino settimanale INGV [automatico]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push riuscito al tentativo $i."
              exit 0
            fi
            echo "Push rifiutato (probabile collisione), tentativo $i/5: pull --rebase e riprovo..."
            sleep $((RANDOM % 10 + 3))
            git pull --rebase origin main
          done
          echo "Push fallito dopo 5 tentativi." >&2
          exit 1

      - name: Segnala il job come fallito se il fetch non è riuscito
        if: steps.fetch.outcome == 'failure'
        run: exit 1
