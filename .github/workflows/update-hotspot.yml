name: Aggiorna hotspot termico Etna

on:
  schedule:
    # Ogni 30 minuti: i passaggi satellitari VIIRS non sono comunque più
    # frequenti di qualche ora, ma un controllo più ravvicinato non costa
    # nulla su repository pubblico e ci fa vedere prima un nuovo dato.
    - cron: "*/30 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-hotspot:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests

      - name: Aggiorna data/hotspot.json
        id: fetch
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python3 scripts/fetch_hotspot.py
        continue-on-error: true

      # Fix 2026-08: prima, se lo step sopra falliva (es. NASA FIRMS
      # irraggiungibile su entrambi gli host), GitHub Actions saltava questo
      # step di commit — quindi il marcatore "stale" scritto dallo script
      # nel file (vedi fetch_hotspot.py) non veniva mai pubblicato, e il
      # sito continuava a mostrare in buona fede l'ultimo dato vecchio come
      # se fosse attuale. "if: always()" garantisce che il commit avvenga
      # comunque, pubblicando sempre lo stato più onesto disponibile.
      - name: Commit se ci sono cambiamenti
        if: always()
        run: |
          git config user.name "etna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/hotspot.json
          git diff --cached --quiet || git commit -m "Aggiorna hotspot termico [automatico]"
          git push

      # Fa comunque fallire visibilmente il job (email/notifica GitHub) se
      # il fetch non è riuscito, così l'informazione arriva sia sul sito
      # (stale:true, pubblico) sia a te (notifica, per capire se serve
      # intervenire, es. chiave FIRMS scaduta).
      - name: Segnala il job come fallito se il fetch non è riuscito
        if: steps.fetch.outcome == 'failure'
        run: exit 1
