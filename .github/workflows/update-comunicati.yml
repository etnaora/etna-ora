name: Aggiorna comunicati INGV Etna

on:
  schedule:
    # Ogni 15 minuti, sfasato di 5 rispetto al workflow dei terremoti
    # (che scrive anch'esso su feed.json): evita che i due tentino di
    # fare commit sullo stesso file nello stesso momento.
    - cron: "5-59/15 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-comunicati:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Imposta Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install requests beautifulsoup4

      - name: Aggiorna data/feed.json (comunicati)
        run: python3 scripts/fetch_comunicati.py

      # Fix 2026-08: lo sfasamento del cron (sopra) riduce ma non elimina le
      # collisioni con update-feed.yml, che scrive sullo STESSO file
      # (feed.json): GitHub Actions può ritardare l'avvio di un run di
      # qualche minuto sotto carico, quindi due esecuzioni possono comunque
      # sovrapporsi. Prima un push rifiutato faceva fallire il job e basta,
      # perdendo l'aggiornamento. Ora, se il push viene rifiutato perché nel
      # frattempo l'altro workflow ha già pubblicato la sua versione,
      # riscarichiamo (`git pull --rebase`) e ritentiamo, fino a 5 volte.
      - name: Commit e push (con retry anti-collisione)
        run: |
          git config user.name "etna-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/feed.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da pubblicare."
            exit 0
          fi
          git commit -m "Aggiorna comunicati INGV [automatico]"
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Push riuscito al tentativo $i."
              exit 0
            fi
            echo "Push rifiutato (probabile collisione con un altro workflow), tentativo $i/5: pull --rebase e riprovo tra qualche secondo..."
            sleep $((RANDOM % 10 + 3))
            git pull --rebase origin main
          done
          echo "Push fallito dopo 5 tentativi." >&2
          exit 1
